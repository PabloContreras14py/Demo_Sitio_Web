<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}FC Barcelona - Tienda Oficial{% endblock %}</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        fcbBlue: '#004D98',   /* Azul oficial */
                        fcbRed: '#A50044',    /* Grana oficial */
                        fcbGold: '#EDBB00'    /* Dorado oficial */
                    }
                }
            }
        }
    </script>
</head>

<body
    class="bg-gradient-to-br from-[#004D98] via-blue-900 to-[#A50044] dark:from-[#0a0512] dark:via-[#150a21] dark:to-[#2e0854] text-white min-h-screen flex flex-col transition-colors duration-500">
</body>

<!-- Fondo inicial Azulgrana oficial -->

<body class="bg-gradient-to-br from-[#004D98] via-blue-900 to-[#A50044] text-white min-h-screen flex flex-col">

    <!-- NAVBAR -->
    <header class="bg-fcbBlue text-white shadow-lg sticky top-0 z-50 border-b-4 border-fcbGold">
        <div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
            <!-- Escudo / Logo -->
            <div class="flex items-center space-x-3">
                <div
                    class="w-9 h-9 bg-fcbRed text-fcbGold flex items-center justify-center font-black rounded-full border-2 border-fcbGold shadow-md">
                    FCB
                </div>
                <span class="text-xl font-black tracking-wide">FC BARCELONA</span>
            </div>

            <!-- Menú de Navegación -->
            <nav class="flex space-x-6 font-bold text-sm uppercase tracking-wider">
                <a href="{{ url_for('main.inicio') }}" class="hover:text-fcbGold transition-colors">Inicio</a>
                <a href="{{ url_for('main.productos') }}" class="hover:text-fcbGold transition-colors">Productos</a>
                <a href="{{ url_for('main.nosotros') }}" class="hover:text-fcbGold transition-colors">Nosotros</a>
                <button id="theme-toggle" class="p-2 rounded-full bg-white/10 hover:bg-white/20 border border-white/20">
                    <span id="theme-icon">🌙</span>
                </button>

            </nav>
        </div>
    </header>

    <!-- CONTENIDO DINÁMICO (Vistas de Flask) -->
    <main class="flex-grow max-w-6xl mx-auto w-full px-4 py-8">
        {% block content %}{% endblock %}
    </main>

    <!-- FOOTER -->
    <footer class="bg-fcbBlue text-white text-center py-4 border-t-4 border-fcbRed text-sm">
        <p class="font-bold">Més que un club — © 2026 FC Barcelona Frontend Demo</p>
    </footer>

    <script>
    const themeToggleBtn = document.getElementById('theme-toggle');
    const themeIcon = document.getElementById('theme-icon');

    if (localStorage.getItem('theme') === 'dark') {
        document.documentElement.classList.add('dark');
        themeIcon.textContent = '☀️';
    }

    themeToggleBtn.addEventListener('click', () => {
        document.documentElement.classList.toggle('dark');
        const isDark = document.documentElement.classList.contains('dark');
        localStorage.setItem('theme', isDark ? 'dark' : 'light');
        themeIcon.textContent = isDark ? '☀️' : '🌙';
    });
</script>

</body>

</html>

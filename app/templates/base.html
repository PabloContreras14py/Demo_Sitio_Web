<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}FC Barcelona - Tienda Oficial{% endblock %}</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        fcbBlue: '#004D98',   /* Azul oficial */
                        fcbRed: '#A50044',    /* Grana oficial */
                        fcbGold: '#EDBB00'    /* Dorado oficial */
                    }
                }
            }
        }
    </script>
</head>
<!-- Fondo inicial Azulgrana oficial -->

<body class="bg-gradient-to-br from-[#004D98] via-blue-900 to-[#A50044] text-white min-h-screen flex flex-col">

    <!-- NAVBAR -->
    <header class="bg-fcbBlue text-white shadow-lg sticky top-0 z-50 border-b-4 border-fcbGold">
        <div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
            <!-- Escudo / Logo -->
            <div class="flex items-center space-x-3">
                <div
                    class="w-9 h-9 bg-fcbRed text-fcbGold flex items-center justify-center font-black rounded-full border-2 border-fcbGold shadow-md">
                    FCB
                </div>
                <span class="text-xl font-black tracking-wide">FC BARCELONA</span>
            </div>

            <!-- Menú de Navegación -->
            <nav class="flex space-x-6 font-bold text-sm uppercase tracking-wider">
                <a href="{{ url_for('main.inicio') }}" class="hover:text-fcbGold transition-colors">Inicio</a>
                <a href="{{ url_for('main.productos') }}" class="hover:text-fcbGold transition-colors">Productos</a>
                <a href="{{ url_for('main.nosotros') }}" class="hover:text-fcbGold transition-colors">Nosotros</a>
            </nav>
        </div>
    </header>

    <!-- CONTENIDO DINÁMICO (Vistas de Flask) -->
    <main class="flex-grow max-w-6xl mx-auto w-full px-4 py-8">
        {% block content %}{% endblock %}
    </main>

    <!-- FOOTER -->
    <footer class="bg-fcbBlue text-white text-center py-4 border-t-4 border-fcbRed text-sm">
        <p class="font-bold">Més que un club — © 2026 FC Barcelona Frontend Demo</p>
    </footer>

</body>

</html>
